name: Pipeline Multagente Gemini

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

jobs:
  multi-agent-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar SDK de Gemini
        run: npm install @google/genai

      - name: Obtener contexto del código (git diff o estructura)
        id: code_context
        run: |
          # Captura el diff del último commit o el árbol del repositorio
          DIFF=$(git diff HEAD~1 HEAD 2>/dev/null || git log -1)
          echo "CODE_DIFF<<EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Ejecutar Pipeline Multagente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE_CONTEXT: ${{ env.CODE_DIFF }}
        run: |
          node ./scripts/agent-business.mjs
          node ./scripts/agent-lead.mjs
          node ./scripts/agent-coder.mjs

      - name: Publicar reporte en el Pull Request (Opcional)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('FINAL_MULTIAGENT_REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
